<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Grupos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2>Mis grupos</h2>

        <a href="/profesor/grupos/crear" class="btn btn-primary mb-3">
            Crear grupo
        </a>

        <table class="table table-striped">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="grupo : ${grupos}">

                    <td th:text="${grupo.id}"></td>

                    <td th:text="${grupo.nombre}"></td>

                    <td th:text="${grupo.descripcion}"></td>

                    <td>

                        <a th:href="@{'/profesor/grupos/' + ${grupo.id}}"
                           class="btn btn-info btn-sm">
                            Ver
                        </a>

                        <form th:action="@{'/profesor/grupo/eliminar/' + ${grupo.id}}"
                              method="post"
                              style="display:inline">

                            <button class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Eliminar grupo?')">
                                Eliminar
                            </button>

                        </form>

                    </td>

                </tr>

            </tbody>

        </table>

        <a href="/profesor" class="btn btn-secondary">
            Volver
        </a>

    </div>

</body>
</html>
