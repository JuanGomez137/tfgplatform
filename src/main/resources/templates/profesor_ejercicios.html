<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Ejercicios</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<h2>Ejercicios</h2>

<a href="/profesor/ejercicios/crear" class="btn btn-primary mb-3">
Crear ejercicio
</a>

<table class="table table-striped">

<thead>

<tr>
<th>ID</th>
<th>Título</th>
<th>Fecha límite</th>
<th>Acciones</th>
</tr>

</thead>

<tbody>

<tr th:each="ejercicio : ${ejercicios}">

<td th:text="${ejercicio.id}"></td>

<td th:text="${ejercicio.titulo}"></td>

<td th:text="${#temporals.format(ejercicio.fechaLimite, 'dd/MM/yyyy HH:mm')}"></td>

<td>

<a th:href="@{/profesor/ejercicios/{id}(id=${ejercicio.id})}" 
class="btn btn-sm btn-info">

Ver ejercicio

</a>

<a th:href="@{/profesor/ejercicios/{id}/asignar(id=${ejercicio.id})}" 
class="btn btn-sm btn-success">
Asignar
</a>

  <form th:action="@{'/profesor/ejercicio/eliminar/' + ${ejercicio.id}}"
                              method="post"
                              style="display:inline">

                            <button class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Eliminar ejercicio?')">
                                Eliminar
                            </button>

                        </form>

</td>

</tr>

</tbody>

</table>

<a href="/profesor" class="btn btn-secondary">
Volver
</a>

</div>

</body>

</html>
