<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Ejercicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-4">

    <div th:if="${param.editado}" class="alert alert-success alert-dismissible fade show">
        Ejercicio actualizado correctamente.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Cabecera con botón editar -->
    <div class="d-flex align-items-center gap-3 mb-1">
        <h2 class="mb-0" th:text="${ejercicio.titulo}"></h2>
        <button class="btn btn-outline-secondary btn-sm" type="button"
                data-bs-toggle="collapse" data-bs-target="#formEditar">
            Editar
        </button>
    </div>
    <p class="text-muted" th:text="${ejercicio.descripcion}"></p>
    <p>
        <strong>Fecha límite:</strong>
        <span th:text="${ejercicio.fechaLimite != null ? #temporals.format(ejercicio.fechaLimite, 'dd/MM/yyyy HH:mm') : 'Sin límite'}"></span>
    </p>

    <!-- Formulario de edición (colapsable) -->
    <div class="collapse mb-4" id="formEditar">
        <div class="card card-body bg-light">
            <h5 class="mb-3">Editar ejercicio</h5>
            <form th:action="@{/profesor/ejercicios/{id}/editar(id=${ejercicio.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" name="titulo" class="form-control"
                           th:value="${ejercicio.titulo}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3"
                              th:text="${ejercicio.descripcion}"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de publicación</label>
                        <input type="datetime-local" name="fechaPublicacion" class="form-control"
                               th:value="${ejercicio.fechaPublicacion != null ? #temporals.format(ejercicio.fechaPublicacion, 'yyyy-MM-dd''T''HH:mm') : ''}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha límite de entrega</label>
                        <input type="datetime-local" name="fechaLimite" class="form-control"
                               th:value="${ejercicio.fechaLimite != null ? #temporals.format(ejercicio.fechaLimite, 'yyyy-MM-dd''T''HH:mm') : ''}">
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    <button type="button" class="btn btn-secondary"
                            data-bs-toggle="collapse" data-bs-target="#formEditar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <hr>

    <h4>Preguntas</h4>

    <a th:href="@{/profesor/ejercicios/{id}/preguntas(id=${ejercicio.id})}"
       class="btn btn-primary mb-3">
        Gestionar preguntas
    </a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Enunciado</th>
                <th>Tipo</th>
                <th>Puntuación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pregunta : ${preguntas}">
                <td th:text="${pregunta.id}"></td>
                <td th:text="${pregunta.enunciado}"></td>
                <td th:text="${pregunta.tipo}"></td>
                <td th:text="${pregunta.puntuacionMaxima}"></td>
                <td>
                    <form th:action="@{'/profesor/pregunta/eliminar/' + ${pregunta.id}}"
                          method="post" style="display:inline">
                        <button class="btn btn-danger btn-sm"
                                onclick="return confirm('¿Eliminar pregunta?')">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <br>
    <a href="/profesor/ejercicios" class="btn btn-secondary">Volver</a>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
