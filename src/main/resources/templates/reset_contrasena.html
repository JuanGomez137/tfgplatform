<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nueva contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
<div class="row justify-content-center mt-5">
<div class="col-md-5">
<div class="card shadow">
<div class="card-body">

    <h3 class="text-center mb-4">Nueva contraseña</h3>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
        <br>
        <a href="/recuperar-contrasena" class="btn btn-sm btn-secondary mt-2">Solicitar nuevo enlace</a>
    </div>

    <form th:if="${token != null}" action="/reset-contrasena" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="mb-3">
            <label class="form-label">Nueva contraseña</label>
            <input type="password" name="nuevaPassword" class="form-control"
                   minlength="6" required placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
    </form>

    <hr>
    <div class="text-center">
        <a href="/login">Volver al inicio de sesión</a>
    </div>

</div>
</div>
</div>
</div>
</div>

</body>
</html>
