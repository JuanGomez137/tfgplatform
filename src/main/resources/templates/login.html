<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

<div class="center-box container-box">

<h3 class="text-center mb-4">Iniciar sesión</h3>

<form method="post" action="/login">

<div class="mb-3">
<label>Email</label>
<input type="text" name="username" class="form-control">
</div>

<div class="mb-3">
<label>Contraseña</label>
<input type="password" name="password" class="form-control">
</div>

<button class="btn btn-primary w-100">
Entrar
</button>

<div class="text-center mt-3">
    <a href="/registro">Crear cuenta</a>
    &nbsp;·&nbsp;
    <a href="/recuperar-contrasena">¿Olvidaste tu contraseña?</a>
</div>

<div th:if="${param.error}" class="alert alert-danger mt-3 py-2 text-center small">
    Email o contraseña incorrectos.
</div>
<div th:if="${param.registrado}" class="alert alert-success mt-3 py-2 text-center small">
    ¡Cuenta creada correctamente! Ya puedes iniciar sesión.
</div>
<div th:if="${param.passwordReset}" class="alert alert-success mt-3 py-2 text-center small">
    Contraseña actualizada correctamente. Ya puedes iniciar sesión.
</div>

</form>

</div>

</div>

</body>
</html>
