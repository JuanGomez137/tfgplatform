<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirmar cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
<div class="row justify-content-center mt-5">
<div class="col-md-5">
<div class="card shadow">
<div class="card-body text-center">

    <div th:if="${ok}">
        <h3 class="text-success mb-3">✔ ¡Cuenta activada!</h3>
        <p>Tu cuenta ha sido confirmada correctamente. Ya puedes iniciar sesión.</p>
        <a href="/login" class="btn btn-primary mt-2">Ir al inicio de sesión</a>
    </div>

    <div th:if="${error}">
        <h3 class="text-danger mb-3">Enlace no válido</h3>
        <p class="text-muted" th:text="${error}"></p>
        <a href="/registro" class="btn btn-secondary mt-2">Volver al registro</a>
    </div>

</div>
</div>
</div>
</div>
</div>

</body>
</html>
