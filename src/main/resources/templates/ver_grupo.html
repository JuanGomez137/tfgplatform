<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Grupo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script>

function buscarAlumno(){

let input = document.getElementById("busqueda");
let filtro = input.value.toLowerCase();

let tabla = document.getElementById("tablaAlumnos");
let filas = tabla.getElementsByTagName("tr");

for(let i = 0; i < filas.length; i++){

let email = filas[i].getElementsByTagName("td")[1];

if(email){

let texto = email.textContent || email.innerText;

if(texto.toLowerCase().indexOf(filtro) > -1){

filas[i].style.display = "";

}else{

filas[i].style.display = "none";

}

}

}

}

</script>

</head>

<body>

<div class="container mt-4">

<div th:if="${param.editado}" class="alert alert-success alert-dismissible fade show">
    Grupo actualizado correctamente.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- Cabecera con botón editar -->
<div class="d-flex align-items-center gap-3 mb-1">
    <h2 class="mb-0" th:text="${grupo.nombre}"></h2>
    <button class="btn btn-outline-secondary btn-sm" type="button"
            data-bs-toggle="collapse" data-bs-target="#formEditarGrupo">
        Renombrar
    </button>
</div>

<!-- Formulario de edición del grupo (colapsable) -->
<div class="collapse mb-3" id="formEditarGrupo">
    <div class="card card-body bg-light mt-2">
        <form th:action="@{/profesor/grupos/{id}/editar(id=${grupo.id})}" method="post" class="row g-2 align-items-end">
            <div class="col-md-5">
                <label class="form-label mb-1">Nombre del grupo</label>
                <input type="text" name="nombre" class="form-control"
                       th:value="${grupo.nombre}" required>
            </div>
            <div class="col-md-5">
                <label class="form-label mb-1">Descripción</label>
                <input type="text" name="descripcion" class="form-control"
                       th:value="${grupo.descripcion}">
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <button type="button" class="btn btn-secondary"
                        data-bs-toggle="collapse" data-bs-target="#formEditarGrupo">✕</button>
            </div>
        </form>
    </div>
</div>

<!-- Mensaje tras publicar notas -->
<div th:if="${param.publicadas}" class="alert alert-success mt-2">
    Se han publicado <strong th:text="${param.publicadas[0]}"></strong> nota(s) a los alumnos de este grupo.
</div>
<div th:if="${param.publicadas != null and param.publicadas[0] == '0'}" class="alert alert-info mt-2">
    No había notas pendientes de publicar en este grupo.
</div>

<!-- Botones de acción del grupo -->
<div class="d-flex gap-2 mb-3 flex-wrap">
    <form th:action="@{/profesor/grupos/{id}/publicar_notas(id=${grupo.id})}" method="post">
        <button type="submit" class="btn btn-success"
                onclick="return confirm('¿Publicar todas las notas corregidas de este grupo? Los alumnos podrán verlas.')">
            Publicar todas las notas del grupo
        </button>
    </form>
    <a th:href="@{/profesor/grupos/{id}/exportar-notas(id=${grupo.id})}" class="btn btn-outline-secondary">
        Exportar notas (.csv)
    </a>
</div>

<h4 class="mt-4">Alumnos</h4>

<!-- BARRA BUSQUEDA -->

<div class="mb-3">

<input 
type="text"
id="busqueda"
onkeyup="buscarAlumno()"
class="form-control"
placeholder="Buscar alumno por email">

</div>

<table class="table">

<thead>

<tr>
<th>Nombre</th>
<th>Email</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="tablaAlumnos">

<tr th:each="alumno : ${grupo.alumnos}">

<td th:text="${alumno.nombre}"></td>

<td th:text="${alumno.email}"></td>

<td>

<form th:action="@{/profesor/grupos/{grupoId}/eliminar_alumno/{alumnoId}
(grupoId=${grupo.id}, alumnoId=${alumno.id})}" 
method="post">

<button class="btn btn-danger btn-sm">
Eliminar
</button>

</form>

</td>

</tr>

</tbody>

</table>

<hr>

<h4>Añadir alumnos</h4>

<div th:if="${error}" class="alert alert-danger">
<span th:text="${error}"></span>
</div>

<form th:action="@{/profesor/grupos/{id}/agregar_alumno(id=${grupo.id})}" method="post">

<div class="mb-3">

<label>Pegar emails separados por coma</label>

<textarea 
name="emails"
class="form-control"
placeholder="alumno1@email.com, alumno2@email.com">
</textarea>

</div>

<button class="btn btn-primary">
Añadir alumnos
</button>

</form>

</form>

<hr>


<br>


<a href="/profesor/grupos" class="btn btn-secondary mt-3">
Volver
</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
