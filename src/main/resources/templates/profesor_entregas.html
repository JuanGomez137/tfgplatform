<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Entregas de alumnos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2>Entregas de alumnos</h2>

        <table class="table table-striped mt-4">

            <thead>

                <tr>
                    <th>Alumno</th>
                    <th>Ejercicio</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Nota</th>
                    <th>Publicar</th>
                    <th>Detalle</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="entrega : ${entregas}">

                    <td th:text="${entrega.alumno.nombre}"></td>

                    <td th:text="${entrega.ejercicio.titulo}"></td>

                    <td th:text="${#temporals.format(entrega.fechaEntrega, 'dd/MM/yyyy HH:mm')}"></td>

                    <td>
                        <span th:text="${entrega.estado}"></span>
                        <span th:if="${entrega.estado.name() == 'EN_RECLAMACION'}"
                              class="badge bg-warning text-dark ms-1">Reclamada</span>
                    </td>

                    <td th:text="${entrega.notaTotal}"></td>

                    <td>

                        <form th:action="@{'/profesor/publicar_nota/' + ${entrega.id}}" method="post">


                            <button class="btn btn-success btn-sm"
                                    th:if="${!entrega.visibleAlumno}">
                                Publicar
                            </button>

                            <span th:if="${entrega.visibleAlumno}" class="badge bg-success">
                                Publicada
                            </span>

                        </form>

                    </td>

                    <td>
                    <a th:href="@{'/profesor/entrega/' + ${entrega.id}}"
                        class="btn btn-primary btn-sm">
                        Ver detalles</a>
                    </td>

                </tr>

            </tbody>

        </table>

        <a href="/profesor" class="btn btn-secondary">
            Volver
        </a>

    </div>

</body>

</html>
