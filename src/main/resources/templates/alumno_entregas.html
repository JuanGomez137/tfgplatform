<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mis entregas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2>Mis entregas</h2>
    <p class="text-muted">
        Aquí aparecen tus prácticas enviadas. Una vez que el profesor publique la nota
        podrás verla y, si crees que hay un error, enviar una reclamación.
    </p>

    <table class="table table-striped mt-4 align-middle">
        <thead class="table-dark">
            <tr>
                <th>Ejercicio</th>
                <th>Fecha entrega</th>
                <th>Estado</th>
                <th>Nota</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entrega : ${entregas}">

                <td th:text="${entrega.ejercicio.titulo}"></td>

                <td th:text="${#temporals.format(entrega.fechaEntrega, 'dd/MM/yyyy HH:mm')}"></td>

                <td>
                    <span class="badge"
                          th:text="${entrega.estado}"
                          th:classappend="${entrega.estado.name() == 'CORREGIDO_MANUAL'} ? 'bg-info' :
                                         (${entrega.estado.name() == 'CORREGIDO_AUTO'} ? 'bg-success' : 'bg-secondary')">
                    </span>
                </td>

                <td>
                    <span th:if="${entrega.visibleAlumno}" class="fw-bold"
                          th:text="${entrega.notaTotal}"></span>
                    <span th:if="${!entrega.visibleAlumno}" class="text-muted small">
                        Pendiente de publicación
                    </span>
                </td>

                <td>
                    <a th:if="${entrega.visibleAlumno}"
                       th:href="@{'/alumno/entrega/' + ${entrega.id}}"
                       class="btn btn-primary btn-sm">
                        <i class="bi bi-eye me-1"></i>Ver detalles
                    </a>
                    <span th:if="${!entrega.visibleAlumno}" class="text-muted small">
                        No disponible aún
                    </span>
                </td>

            </tr>
        </tbody>
    </table>

    <a href="/alumno" class="btn btn-secondary">
        <i class="bi bi-arrow-left me-1"></i>Volver
    </a>

</div>

</body>
</html>
