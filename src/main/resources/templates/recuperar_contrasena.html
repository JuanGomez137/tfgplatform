<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recuperar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
<div class="row justify-content-center mt-5">
<div class="col-md-5">
<div class="card shadow">
<div class="card-body">

    <h3 class="text-center mb-4">Recuperar contraseña</h3>

    <div th:if="${mensaje}" class="alert alert-success">
        <span th:text="${mensaje}"></span>
    </div>

    <div th:if="${mensaje == null}">
        <p class="text-muted small">Introduce tu correo institucional y te enviaremos un enlace para restablecer tu contraseña.</p>

        <form action="/recuperar-contrasena" method="post">
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="email" class="form-control"
                       placeholder="usuario@alumnos.upm.es" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
        </form>
    </div>

    <hr>
    <div class="text-center">
        <a href="/login">Volver al inicio de sesión</a>
    </div>

</div>
</div>
</div>
</div>
</div>

</body>
</html>
