<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Asignar ejercicio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4" style="max-width:600px">

    <h2>Asignar ejercicio a grupos</h2>
    <h5 class="text-muted mt-2 mb-1" th:text="${ejercicio.titulo}"></h5>
    <hr>

    <div th:if="${#lists.isEmpty(grupos)}" class="alert alert-warning">
        No hay grupos creados todavía.
        <a href="/profesor/grupos/nuevo" class="alert-link">Crear un grupo</a>
    </div>

    <form th:if="${!#lists.isEmpty(grupos)}"
          th:action="@{/profesor/ejercicios/{id}/asignar(id=${ejercicio.id})}" method="post">

        <p class="text-muted small mb-3">
            Marca los grupos a los que quieres asignar este ejercicio.
            Desmarca los que quieras <strong>desasignar</strong>. Los cambios son definitivos al guardar.
        </p>

        <div class="list-group mb-4">
            <label th:each="grupo : ${grupos}"
                   th:for="'grupo' + ${grupo.id}"
                   class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <span th:text="${grupo.nombre}"></span>
                <input class="form-check-input ms-2"
                       type="checkbox"
                       name="gruposIds"
                       th:value="${grupo.id}"
                       th:id="'grupo' + ${grupo.id}"
                       th:checked="${gruposAsignados.contains(grupo.id)}">
            </label>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                Guardar asignación
            </button>
            <a th:href="@{/profesor/ejercicios}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>

    </form>

    <a th:if="${#lists.isEmpty(grupos)}" href="/profesor/ejercicios" class="btn btn-secondary mt-3">
        Volver
    </a>

</div>

</body>
</html>
