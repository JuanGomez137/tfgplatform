<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear ejercicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Crear nuevo ejercicio</h2>

<div th:if="${error}" class="alert alert-danger">
    <span th:text="${error}"></span>
</div>

<form th:action="@{/profesor/ejercicios/crear}" th:object="${ejercicio}" method="post">

    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" class="form-control" th:field="*{titulo}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" th:field="*{descripcion}"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Fecha límite</label>
        <input type="datetime-local" class="form-control" th:field="*{fechaLimite}">
    </div>

    <button class="btn btn-success">
        Crear ejercicio
    </button>

</form>

<br>

<a href="/profesor" class="btn btn-secondary">
    Volver
</a>

</body>
</html>
