spring.application.name=tfgplatform
# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/plataforma_evaluacion
spring.datasource.username=
spring.datasource.password=

# ===============================
# JPA CONFIGURATION
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect




spring.thymeleaf.cache=false

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
uploads.path=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20971520
spring.servlet.multipart.max-request-size=26214400
server.tomcat.max-http-form-post-size=-1


# ===============================
# AI GRADING SERVICE
# ===============================
# Token de GitHub: https://github.com/settings/tokens (scope: read:user)
# Si no se configura ai.openai.key, la corrección automática no estará disponible
# y las preguntas TEXTO e IMAGEN quedarán pendientes de revisión manual.

ai.openai.endpoint=https://models.inference.ai.azure.com
ai.openai.key=
ai.openai.model=gpt-4o-mini

# ===============================
# MAIL SERVICE
# ===============================


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.base-url=http://localhost:8080